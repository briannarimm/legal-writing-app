# Builds every document in documents/ on every push to main (PDF, Word, HTML or text,
# depending on its template), plus a redline against each document's latest version tag.
# Pushing a document's version tag (the app's "Tag version" makes <name>/v0.3; push it
# with `git push --tags`) builds just that document and publishes a GitHub Release with
# its files and its redline against the previous version.
name: Build documents

on:
  push:
    branches: [main]
    tags: ["*/v*"]
    paths:
      - "documents/**"
      - "library/**"
      - "templates/**"
      - "filters/**"
      - "defaults/**"
      - "docker/**"
      - "scripts/**"
      - "Makefile"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history + tags, for the redlines

      - uses: docker/setup-buildx-action@v3
      - name: Build pinned Pandoc image (cached)
        uses: docker/build-push-action@v6
        with:
          context: docker
          tags: lawreview-build:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build documents and redlines
        run: |
          git config user.name "$(git log -1 --format=%an)"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            DOCS="${GITHUB_REF_NAME%%/*}"
          else
            DOCS="$(ls documents | grep -v '^_' || true)"
          fi
          mkdir -p build
          for slug in $DOCS; do
            [[ -f "documents/$slug/document.json" ]] || continue
            echo "### $slug" >> "$GITHUB_STEP_SUMMARY"
            make all DOC="documents/$slug" 2>&1 | tee "build/$slug-build.log"
            tail -1 "build/$slug-build.log" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              BASE=$(git describe --tags --abbrev=0 --match "$slug/v*" "${GITHUB_REF_NAME}^" 2>/dev/null || true)
            else
              BASE=$(git describe --tags --abbrev=0 --match "$slug/v*" 2>/dev/null || true)
            fi
            # email documents have no redline; make says so and moves on
            if [[ -n "$BASE" ]] && grep -q '"redline": true' "templates/$(sed -n 's/.*"template": *"\([^"]*\)".*/\1/p' "documents/$slug/document.json")/template.json"; then
              make redline DOC="documents/$slug" BASE="$BASE" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Name the run
        run: |
          STAMP="$(date -u +%Y-%m-%d)-$(git rev-parse --short HEAD)"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] && STAMP="${GITHUB_REF_NAME//\//-}"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: documents-${{ env.STAMP }}
          path: |
            build/*/*.pdf
            build/*/*.docx
            build/*/*.html
            build/*/*.txt
          retention-days: 90

      - name: Publish release (tags only)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          slug="${GITHUB_REF_NAME%%/*}"
          gh release create "$GITHUB_REF_NAME" build/$slug/*.pdf build/$slug/*.docx build/$slug/*.html build/$slug/*.txt \
            --title "$slug ${GITHUB_REF_NAME#*/}" \
            --notes "$(tail -1 build/$slug-build.log)" 2>/dev/null \
          || gh release create "$GITHUB_REF_NAME" $(ls build/$slug/*.pdf build/$slug/*.docx build/$slug/*.html build/$slug/*.txt 2>/dev/null) \
            --title "$slug ${GITHUB_REF_NAME#*/}" --notes "Built from $GITHUB_REF_NAME"

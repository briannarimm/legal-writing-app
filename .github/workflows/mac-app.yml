# Builds ReWord.app on a Mac for every pull request that changes the program, runs the ReSuite checks,
# and takes screenshots of the real app: the window, links from the other ReSuite apps (a document
# opened from the hub, RePDF's highlights made into a note), the shared window glass and the suite menu.
# The app is attached to the run; the download in distro/ is still made with `make dist`.
name: ReWord for Mac

on:
  pull_request:
    paths:
      - "app/**"
      - "scripts/make_app.py"
      - "scripts/make_icon.swift"
      - "templates/**"
      - "filters/**"
      - "tests/**"
      - ".github/workflows/mac-app.yml"
  workflow_dispatch:

permissions:
  contents: write   # the screenshots are shared on refs/ci/gallery

concurrency:
  group: mac-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Checks
        run: |
          python3 tests/test_suite.py
          python3 tests/test_projects.py
          python3 tests/test_note_links.py

      - name: Compile the window and the PDF helper
        run: |
          swiftc -O -target arm64-apple-macos12.0 -framework AppKit -framework WebKit app/mac/main.swift -o "$RUNNER_TEMP/ReWord-shell"
          swiftc -O -target arm64-apple-macos12.0 -framework AppKit -framework WebKit -framework PDFKit app/mac/rwpdf.swift -o "$RUNNER_TEMP/rwpdf"

      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ReWord Build
          key: reword-build-${{ hashFiles('scripts/make_app.py', 'templates/**') }}
          restore-keys: reword-build-

      - name: Build ReWord.app
        run: python3 scripts/make_app.py --out "$RUNNER_TEMP/ReWord"

      - name: Screenshots
        continue-on-error: true
        run: |
          APP="$RUNNER_TEMP/ReWord/ReWord.app"
          G="$PWD/gallery"; mkdir -p "$G"
          DATA="$RUNNER_TEMP/rwdata"; SUITE="$RUNNER_TEMP/resuite"
          SLUG=$(python3 - "$DATA" "$SUITE" <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, "app")
          import store
          data, suite = Path(sys.argv[1]), Path(sys.argv[2])
          store.set_root(data)
          p = store.create_project({"name": "Online Dispute Resolution", "default_template": "article"})
          store.write_citation("doe-courts", {"type": "journal", "fields": {"authors": [{"given": "Jane", "family": "Doe"}], "title": "Courts Online",
                               "journal": "Journal of Dispute Resolution", "volume": "12", "first_page": "1", "date": "2025"}}, create=True)
          slug = store.create_document("article", "Online Dispute Resolution and Rural Access to Justice", p["id"])
          d = store.doc_path(slug)
          (d / "01-introduction.md").write_text(
              "# Introduction {.unnumbered}\n\nRural litigants travel farther to reach a courthouse than anyone else.[^a] "
              "Online dispute resolution promises to close that gap.\n\n[^a]: See [Doe]{.cite tag=\"doe-courts\"}.\n", encoding="utf-8")
          (d / "02-background.md").write_text("# Three pilots\n\n- Utah small claims ODR\n- Michigan MI-Resolve\n- Ohio online traffic court\n", encoding="utf-8")
          (suite / "Projects").mkdir(parents=True)
          (suite / "Handoffs").mkdir(parents=True)
          (suite / "Appearance.json").write_text('{"windowGlass": 0.35}\n')
          (suite / "Projects" / "8E0D4C1A-0000-4000-8000-000000000001.json").write_text(json.dumps({
              "formatVersion": 1, "id": "8E0D4C1A-0000-4000-8000-000000000001", "name": "ODR Talk", "color": "#1F8FA6",
              "items": [{"id": "6B1B0D52-0000-4000-8000-000000000002", "kind": "rewordProject", "app": "reword", "path": p["id"], "title": "ODR"}]}))
          (suite / "Handoffs" / "ci-highlights.json").write_text(json.dumps({
              "version": 1, "kind": "highlights", "from": "repdf", "title": "Courts Online", "source": "/tmp/Courts Online.pdf",
              "suiteProject": "8E0D4C1A-0000-4000-8000-000000000001",
              "highlights": [{"page": 12, "text": "Phone-first design doubled participation among rural users.", "note": "For the slide on what worked."},
                             {"page": 4, "text": "The median round trip to the county seat was 70 miles.", "color": "green"}]}))
          print(slug)
          PY
          )
          echo "document: $SLUG"
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f "$APP"
          defaults write app.reword ApplePersistenceIgnoreState -bool YES
          quit_app() { osascript -e 'tell application "ReWord" to quit' >/dev/null 2>&1 || true; sleep 3; pkill -x ReWord || true; sleep 1; }
          glass() { # what another ReSuite app does when its window glass slider moves
            printf '{"windowGlass": %s}\n' "$1" > "$SUITE/Appearance.json"
            osascript -l JavaScript -e 'ObjC.import("Foundation"); $.NSDistributedNotificationCenter.defaultCenter.postNotificationNameObjectUserInfoDeliverImmediately("com.briannarimm.resuite.appearance", $(), $(), true)' || true
          }
          link() { open "$1"; sleep 7; screencapture -x "$G/ui-$2.png" || true; }
          # something busy behind the window, to show the glass
          open -a Preview "$PWD/app/mac/AppIcon.png"; sleep 3
          open --env LT_DATA_DIR="$DATA" --env RESUITE_SUPPORT_DIR="$SUITE" "$APP"
          sleep 30
          screencapture -x "$G/ui-launch.png" || true
          link "reword://open?doc=$SLUG" link-open
          link "reword://handoff?file=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$SUITE/Handoffs/ci-highlights.json")&make=note" link-note
          glass 1.0; sleep 3; screencapture -x "$G/ui-glass-solid.png" || true
          echo "translucent after solid: $(defaults read app.reword translucentWindow 2>&1)" | tee "$G/glass.txt"
          glass 0.35; sleep 3; screencapture -x "$G/ui-glass-frost.png" || true
          echo "translucent after frost: $(defaults read app.reword translucentWindow 2>&1)" | tee -a "$G/glass.txt"
          quit_app
          pkill -x Preview || true
          # the suite menu, opened in the page; the self-test hook snapshots the page and quits
          cat > "$RUNNER_TEMP/menu.js" <<JS
          await new Promise(r => { const t = setInterval(() => { if (window.App && App.booted) { clearInterval(t); r(); } }, 200); });
          await App.views.writing.open('$SLUG');
          await new Promise(r => setTimeout(r, 1500));
          document.getElementById('suite-switch').click();
          await new Promise(r => setTimeout(r, 1500));
          return Array.from(document.querySelectorAll('.ctx-item')).map(e => e.textContent + (e.classList.contains('disabled') ? ' (off)' : ''));
          JS
          LT_DATA_DIR="$DATA" RESUITE_SUPPORT_DIR="$SUITE" LT_SELFTEST_JS="$RUNNER_TEMP/menu.js" LT_SELFTEST_OUT="$G/menu.txt" \
            LT_SNAPSHOT="$G/ui-suite-menu.png" "$APP/Contents/MacOS/ReWord" &
          for i in $(seq 1 60); do [ -f "$G/menu.txt" ] && break; sleep 2; done
          sleep 3; pkill -x ReWord || true
          cat "$G/menu.txt" || true
          ls "$SUITE/Handoffs" "$DATA/research" || true
          tail -40 "$HOME/Library/Logs/ReWord.log" || true
          ls "$G"

      - name: Zip the app
        run: ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/ReWord/ReWord.app" ReWord-mac-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ReWord
          path: ReWord-mac-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: gallery

      # Reviewers without access to artifact storage can fetch the screenshots with
      # `git fetch origin refs/ci/gallery && git checkout FETCH_HEAD -- .` in an empty clone.
      - name: Share screenshots for review
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p review && cp gallery/ui-*.png gallery/*.txt review/ 2>/dev/null || true
          cd review
          for f in ui-*.png; do sips -Z 1400 "$f" >/dev/null; done
          git init -q . && git checkout -q -b gallery
          git add .
          git -c user.name="ReWord CI" -c user.email="ci@users.noreply.github.com" commit -qm "Screenshots for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:refs/ci/gallery
